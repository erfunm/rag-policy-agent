[project]
name = "policy-agent"
version = "2.0.0"
description = "Grounded policy Q&A agent: hand-written LLM tool-calling loop, hybrid retrieval, guardrails and an eval-gated CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastembed>=0.5",
    "anthropic>=0.70",
    "openai>=1.50",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
mcp = ["mcp>=1.2"]
otel = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]
ui = ["streamlit>=1.40"]

[project.scripts]
policy-agent = "policy_agent.cli:main"

[dependency-groups]
dev = [
    "policy-agent[api,mcp,otel]",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["policy_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "fastembed.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the fastembed ONNX models (downloaded on first use)"]

[tool.coverage.run]
source = ["policy_agent"]
omit = [
    # real-provider adapters are covered by contract tests against a local stub server,
    # but excluded from the coverage gate per the project's quality bar
    "*/policy_agent/llm/anthropic.py",
    "*/policy_agent/llm/openai_compat.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
